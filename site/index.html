<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#132A1F">
  <meta name="description" content="Anotador de truco con fósforos: tocá para sumar, mantené para borrar.">
  <title>Anotador de truco</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Figtree:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <!--
    Convención: los botones con data-action disparan una acción del juego
    (ver actionFor() en js/main.js). El resto de los botones tiene un id y lo maneja
    su vista.
  -->
  <div class="app">
    <header class="bar">
      <div class="brand">
        <svg viewBox="0 0 18 26" aria-hidden="true"><rect x="7" y="7" width="4" height="18" rx="1" fill="var(--stick)"/><ellipse cx="9" cy="6.5" rx="4.6" ry="5.5" fill="var(--head)"/></svg>
        Truco
      </div>
      <div class="bar-actions">
        <button class="icon-btn" id="undo-button" data-action="undo" aria-label="Deshacer último cambio">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
        </button>
        <button class="icon-btn" id="open-share" aria-label="Compartir">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"/><path d="m7 8 5-5 5 5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>
        </button>
        <button class="icon-btn" id="open-settings" aria-label="Ajustes">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></svg>
        </button>
      </div>
    </header>

    <main class="teams" id="teams"></main>
  </div>

  <!-- Columna de un equipo. js/view/scoreboard.js la clona una vez por equipo. -->
  <template id="team-template">
    <section class="team">
      <div class="team-head">
        <button class="name" data-ref="nameButton">
          <span class="name-text" data-ref="name"></span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4Z"/></svg>
        </button>
        <div class="wins" data-ref="wins"></div>
        <div class="score" data-ref="score" aria-hidden="true"></div>
        <div class="left" data-ref="standing"></div>
      </div>
      <div class="board" data-ref="board" role="button" tabindex="0">
        <div class="groups" data-ref="groups"></div>
        <div class="hint" data-ref="hint">Tocá para sumar<br>Mantené para borrar</div>
        <div class="erase-tag">Borrando</div>
      </div>
      <div class="controls">
        <button class="minus" data-ref="minus" data-action="subtract">−</button>
        <button class="plus" data-ref="plus" data-action="add" data-points="1">+1</button>
      </div>
      <div class="quick">
        <button data-action="add" data-points="2">+2</button>
        <button data-action="add" data-points="3">+3</button>
        <button data-action="add" data-points="4">+4</button>
      </div>
    </section>
  </template>

  <div class="sr" aria-live="polite" id="announcer"></div>

  <!-- Cartel de ganador (js/view/winner.js) -->
  <div class="modal" id="winner">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="winner-title">
      <svg class="torch" viewBox="0 0 56 130" aria-hidden="true">
        <defs>
          <radialGradient id="flame-gradient" cx="50%" cy="72%" r="62%">
            <stop offset="0" stop-color="#FFF6CF"/><stop offset=".45" stop-color="#FFC247"/><stop offset="1" stop-color="#EF5B2A"/>
          </radialGradient>
        </defs>
        <path class="flame" d="M28 4C40 22 45 36 41 48c-3 9-23 9-26 0C11 36 18 24 28 4Z" fill="url(#flame-gradient)"/>
        <rect x="24" y="52" width="8" height="74" rx="2" class="stick"/>
        <ellipse cx="28" cy="53" rx="8" ry="6.5" fill="#3B1E15"/>
      </svg>
      <h2 id="winner-title"></h2>
      <p id="winner-summary"></p>
      <button class="btn-accent" id="rematch" data-action="newGame">Revancha</button>
      <button class="btn-text" data-action="undo">Deshacer último punto</button>
    </div>
  </div>

  <!-- Compartir (js/view/share.js) -->
  <div class="modal" id="share">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="share-title">
      <h2 id="share-title">Compartir</h2>
      <button class="option" id="share-app">
        <strong>El anotador</strong>
        <small>Para que lo usen en otro celu</small>
      </button>
      <button class="option" id="share-game">
        <strong>Esta partida</strong>
        <small id="share-game-summary"></small>
      </button>
      <p class="status" id="share-status" aria-live="polite"></p>
      <button class="btn-text" id="close-share">Cerrar</button>
    </div>
  </div>

  <!-- Partida recibida por link (js/view/share.js) -->
  <div class="modal" id="shared-game">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="shared-game-title">
      <h2 id="shared-game-title">Partida compartida</h2>
      <p id="shared-game-summary"></p>
      <button class="btn-accent" id="load-shared-game">Cargar partida</button>
      <button class="btn-text" id="ignore-shared-game">No, gracias</button>
    </div>
  </div>

  <!-- Invitación a instalar la app (js/view/install.js) -->
  <div class="install" id="install" hidden>
    <img src="icon-192.png" alt="" width="40" height="40">
    <div class="install-text">
      <strong>Instalá la app</strong>
      <small id="install-hint">Anda sin conexión</small>
    </div>
    <button class="install-button" id="install-button">Instalar</button>
    <button class="icon-btn install-close" id="install-close" aria-label="No mostrar más">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>

  <!-- Ajustes (js/view/settings.js) -->
  <div class="sheet-wrap" id="settings">
    <div class="backdrop" id="settings-backdrop"></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <div class="grip"></div>
      <div class="sheet-head">
        <h2 id="settings-title">Ajustes</h2>
        <button class="btn-done" id="close-settings">Listo</button>
      </div>

      <div class="field">
        <span class="field-label">Partida a</span>
        <div class="seg" role="radiogroup" aria-label="Partida a">
          <button role="radio" data-action="setTarget" data-target="15">15 puntos</button>
          <button role="radio" data-action="setTarget" data-target="30">30 puntos</button>
        </div>
        <p class="help" id="target-help"></p>
      </div>

      <div class="field">
        <span class="field-label">Equipos</span>
        <div class="names">
          <div><label for="name-0">Izquierda</label><input id="name-0" maxlength="14" autocomplete="off" enterkeyhint="done"></div>
          <div><label for="name-1">Derecha</label><input id="name-1" maxlength="14" autocomplete="off" enterkeyhint="done"></div>
        </div>
      </div>

      <div class="field">
        <label class="toggle"><span>Mostrar números</span><input type="checkbox" data-option="showNumbers"><i></i></label>
        <label class="toggle"><span>Botones +2, +3 y +4<small>Para anotar un truco o un envido de una</small></span><input type="checkbox" data-option="quickButtons"><i></i></label>
        <label class="toggle"><span>Vibrar al anotar</span><input type="checkbox" data-option="vibrate"><i></i></label>
        <label class="toggle"><span>Mantener la pantalla encendida<small>Útil con el celu apoyado en la mesa</small></span><input type="checkbox" data-option="keepAwake"><i></i></label>
      </div>

      <div class="field">
        <button class="btn-danger" id="reset-game">Reiniciar partida</button>
        <button class="btn-text" id="clear-wins">Borrar partidas ganadas</button>
      </div>
    </div>
  </div>
</body>
</html>
