<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#132A1F">
<title>Anotador de truco</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Figtree:wght@500;600;700&display=swap" rel="stylesheet">
<meta name="description" content="Anotador de truco con fósforos: tocá para sumar, mantené para borrar.">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/styles.css">
<script type="module" src="js/main.js"></script>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand">
      <svg viewBox="0 0 18 26" aria-hidden="true"><rect x="7" y="7" width="4" height="18" rx="1" fill="var(--stick)"/><ellipse cx="9" cy="6.5" rx="4.6" ry="5.5" fill="var(--head)"/></svg>
      Truco
    </div>
    <div class="bar-actions">
      <button class="icon-btn" id="undoBtn" data-act="undo" aria-label="Deshacer último cambio">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
      </button>
      <button class="icon-btn" data-act="settings" aria-label="Ajustes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></svg>
      </button>
    </div>
  </header>

  <main class="teams" id="teams"></main>
</div>

<div class="sr" aria-live="polite" id="live"></div>

<!-- Ganador -->
<div class="win" id="win">
  <div class="win-card" role="dialog" aria-modal="true" aria-labelledby="winTitle">
    <svg class="torch" viewBox="0 0 56 130" aria-hidden="true">
      <defs>
        <radialGradient id="fl" cx="50%" cy="72%" r="62%">
          <stop offset="0" stop-color="#FFF6CF"/><stop offset=".45" stop-color="#FFC247"/><stop offset="1" stop-color="#EF5B2A"/>
        </radialGradient>
      </defs>
      <path class="flame" d="M28 4C40 22 45 36 41 48c-3 9-23 9-26 0C11 36 18 24 28 4Z" fill="url(#fl)"/>
      <rect x="24" y="52" width="8" height="74" rx="2" class="stick"/>
      <ellipse cx="28" cy="53" rx="8" ry="6.5" fill="#3B1E15"/>
    </svg>
    <h2 id="winTitle"></h2>
    <p id="winScore"></p>
    <button class="btn-accent" data-act="rematch">Revancha</button>
    <button class="btn-text" data-act="undo">Deshacer último punto</button>
  </div>
</div>

<!-- Ajustes -->
<div class="sheet-wrap" id="sheet">
  <div class="backdrop" data-act="close"></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="grip"></div>
    <div class="sheet-head">
      <h2 id="sheetTitle">Ajustes</h2>
      <button class="btn-done" data-act="close">Listo</button>
    </div>

    <div class="field">
      <span class="field-label">Partida a</span>
      <div class="seg" role="radiogroup" aria-label="Partida a">
        <button role="radio" data-act="target" data-v="15">15 puntos</button>
        <button role="radio" data-act="target" data-v="30">30 puntos</button>
      </div>
      <p class="help" id="targetHelp"></p>
    </div>

    <div class="field">
      <span class="field-label">Equipos</span>
      <div class="names">
        <div><label for="n0">Izquierda</label><input id="n0" maxlength="14" autocomplete="off" enterkeyhint="done"></div>
        <div><label for="n1">Derecha</label><input id="n1" maxlength="14" autocomplete="off" enterkeyhint="done"></div>
      </div>
    </div>

    <div class="field">
      <label class="toggle"><span>Mostrar números</span><input type="checkbox" data-opt="numbers"><i></i></label>
      <label class="toggle"><span>Botones +2, +3 y +4<small>Para anotar un truco o un envido de una</small></span><input type="checkbox" data-opt="quick"><i></i></label>
      <label class="toggle"><span>Vibrar al anotar</span><input type="checkbox" data-opt="vibrate"><i></i></label>
      <label class="toggle"><span>Mantener la pantalla encendida<small>Útil con el celu apoyado en la mesa</small></span><input type="checkbox" data-opt="awake"><i></i></label>
    </div>

    <div class="field">
      <button class="btn-danger" data-act="reset" data-label="Reiniciar partida">Reiniciar partida</button>
      <button class="btn-text" data-act="clearwins" data-label="Borrar partidas ganadas">Borrar partidas ganadas</button>
    </div>
  </div>
</div>
</body>
</html>
